name: Publish Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Choose staging, personal launch, festival launch, project routes, or production
        required: true
        type: choice
        default: staging
        options: [staging, personal-launch, festival-launch, project-routes, production]
      project:
        description: Enabled project slug, all, or festivals for festival-launch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  queue: max

jobs:
  publish:
    # Keep general production publishing disabled until it is approved separately.
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected && ((github.event_name == 'workflow_dispatch' && inputs.target == 'personal-launch' && inputs.project == 'personal') || (github.event_name == 'workflow_dispatch' && inputs.target == 'festival-launch' && inputs.project == 'festivals') || (github.event_name == 'workflow_dispatch' && inputs.target == 'project-routes' && inputs.project == 'personal') || (false && (github.event_name == 'push' || inputs.target == 'production') && vars.WORKERS_PUBLISH_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify and plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PROJECT: ${{ inputs.project }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          if [[ "$TARGET" == personal-launch ]]; then
            python3 scripts/deploy_workers.py --project photo-notes
            python3 scripts/deploy_workers.py --project personal
          elif [[ "$TARGET" == festival-launch ]]; then
            python3 scripts/deploy_workers.py --project acl
            python3 scripts/deploy_workers.py --project coachella
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/deploy_workers.py --project "$PROJECT"
          else
            python3 scripts/deploy_workers.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
          fi
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          node --test tests/workers.test.mjs
      - name: Publish in dependency order
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PROJECT: ${{ inputs.project }}
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DOMAIN_API_TOKEN: ${{ inputs.target != 'personal-launch' && inputs.target != 'festival-launch' && inputs.target != 'project-routes' && secrets.CLOUDFLARE_DOMAIN_API_TOKEN || '' }}
        shell: bash
        run: |
          if [[ "$TARGET" == personal-launch ]]; then
            npx --no-install wrangler deploy --config sites/photo-notes/wrangler.json
            python3 scripts/deploy_workers.py --apply --project personal
          elif [[ "$TARGET" == festival-launch ]]; then
            npx --no-install wrangler deploy --config sites/acl/wrangler.json
            npx --no-install wrangler deploy --config sites/coachella/wrangler.json
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/deploy_workers.py --apply --project "$PROJECT"
          else
            python3 scripts/deploy_workers.py --apply --before "$BEFORE_SHA" --after "$AFTER_SHA"
          fi

  stage:
    name: Deploy temporary Workers and check routes
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/workers.test.mjs
      - name: Stage all enabled projects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: python3 scripts/stage_workers.py --subdomain "$WORKERS_DEV_SUBDOMAIN" --run-id "$GITHUB_RUN_ID"
