name: Publish Workers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Staging, update existing Workers, or provision approved domains
        required: true
        type: choice
        options: [staging, update, provision]
      baseline:
        description: Last successfully deployed main commit (production modes)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'staging' && 'cloudflare-staging' || 'cloudflare-production' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.ref_protected && (inputs.mode == 'update' || inputs.mode == 'provision')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.mode == 'provision' && 'cloudflare-provisioning' || 'cloudflare-production' }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      BEFORE_SHA: ${{ inputs.baseline }}
      AFTER_SHA: ${{ github.sha }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Require owner setup
        env:
          ENABLED: ${{ vars.WORKERS_PUBLISH_ENABLED }}
          PROVISIONING_ENABLED: ${{ vars.WORKERS_PROVISIONING_ENABLED }}
        run: |
          test "$ENABLED" = true
          if [[ "$MODE" == provision ]]; then test "$PROVISIONING_ENABLED" = true; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate and plan
        run: |
          [[ "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ && "$BEFORE_SHA" != "$AFTER_SHA" ]]
          git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"
          python3 scripts/deploy_workers.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          node --test tests/workers.test.mjs
      - name: Publish reviewed changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DOMAIN_API_TOKEN: ${{ inputs.mode == 'provision' && secrets.CLOUDFLARE_DOMAIN_API_TOKEN || '' }}
        run: |
          flags=()
          if [[ "$MODE" == provision ]]; then flags+=(--provision); fi
          python3 scripts/deploy_workers.py --apply "${flags[@]}" --before "$BEFORE_SHA" --after "$AFTER_SHA"

  stage:
    if: github.ref == 'refs/heads/main' && github.ref_protected && inputs.mode == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate staging plan without credentials
        env:
          WORKERS_DEV_SUBDOMAIN: ${{ vars.STAGING_WORKERS_DEV_SUBDOMAIN }}
        run: python3 scripts/stage_workers.py --subdomain "$WORKERS_DEV_SUBDOMAIN" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --dry-run
      - name: Stage enabled projects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.STAGING_WORKERS_DEV_SUBDOMAIN }}
        run: |
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ && -n "$CLOUDFLARE_API_TOKEN" ]]
          python3 scripts/stage_workers.py --subdomain "$WORKERS_DEV_SUBDOMAIN" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
